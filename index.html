<style>
:root{--bg:#f6f2e9;--card:#fffdf8;--ink:#17211b;--muted:#68736d;--a:#176b57;--soft:#e3f0eb;--line:#dce3dd}
@media (prefers-color-scheme:dark){
  :root{--bg:#121815;--card:#1b2420;--ink:#eef2ee;--muted:#93a199;--a:#3fbf9a;--soft:#20342c;--line:#2a352f}
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
main{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 17px calc(90px + env(safe-area-inset-bottom))}
header{padding:20px 2px 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:0}h2{margin:4px 0 10px}h3{margin:0 0 8px}.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 6px 20px #17351b0a}
button{border:0;border-radius:14px;padding:13px 16px;background:var(--a);color:white;font-size:16px;font-weight:700;cursor:pointer}
button.secondary{background:var(--soft);color:var(--ink)}button.ghost{background:transparent;color:var(--a);border:1px solid var(--line)}
button:disabled{opacity:.55}
.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.space{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{background:var(--soft);padding:6px 9px;border-radius:99px;font-size:12px;font-weight:700}
.progress{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--a)}
.word{font-size:40px;font-weight:800;margin-top:20px}.pron{color:var(--muted);font-style:italic}.meaning{font-size:21px;margin:8px 0}
.example{background:var(--soft);padding:14px;border-radius:14px;margin:15px 0}.example b{font-size:18px}.notice{font-size:13px;color:var(--muted);line-height:1.5}
.option{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin:7px 0}
.option.correct{background:#1f7a4f;color:#fff;border-color:#1f7a4f}
.option.wrong{background:#a23b3b;color:#fff;border-color:#a23b3b}
.stat{font-size:26px;font-weight:800}.hide{display:none}
.lessonrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.lessonrow:last-child{border-bottom:none}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px}
.badge.done{background:#1f7a4f;color:#fff}.badge.due{background:#c8102e;color:#fff}.badge.locked{background:var(--soft);color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(14px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:720px;margin:auto}
nav button{flex:1;font-size:13px;padding:11px 8px}
[lang="hr"]{unicode-bidi:isolate}
</style></head><body><main>
<header><div><h1>🇭🇷 Kroatisch Tutor</h1><div class="muted">Deutsch → Hrvatski</div></div><span class="pill">Lokal</span></header>

<section id="lesson" class="hide"></section>
<section id="quiz" class="hide"></section>

<nav>
<button onclick="show('home')">Heute</button>
<button onclick="show('progress')">Fortschritt</button>
<button onclick="show('privacy')">Privat</button>
</nav>

const ALL_WORDS = LESSONS.flatMap(l=>l.words);
const WORD_BY_HR = Object.fromEntries(ALL_WORDS.map(w=>[w[0],w]));

/* ---------- Storage (mit Fallback, falls localStorage blockiert ist) ---------- */
const KEY="kt_private_v2";
const memoryFallback = {store:null};
function safeGet(){
  try{ const raw=localStorage.getItem(KEY); return raw?JSON.parse(raw):null; }
  catch(e){ return memoryFallback.store; }
}
function safeSet(data){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ memoryFallback.store = data; }
}
let s = safeGet() || {cards:{}, lessonsCompleted:{}, streak:0};
function save(){ safeSet(s) }

/* ---------- Leitner-Spaced-Repetition ---------- */
const DAY = 86400000;
const INTERVALS = [1,1,2,4,8,16]; // Tage, indiziert nach box

function touchCard(hr, box, dueInDays){
  s.cards[hr] = {box, due: Date.now() + dueInDays*DAY, seen:true};
}
function onLearnMark(hr, ok){
  if(ok){ touchCard(hr, 1, INTERVALS[1]); }
  else  { touchCard(hr, 0, 0); } // sofort wieder fällig
  save();
}
function onReviewAnswer(hr, correct){
  const c = s.cards[hr] || {box:0};
  if(correct){ const b=Math.min(c.box+1,5); touchCard(hr,b,INTERVALS[b]); }
  else       { touchCard(hr,0,INTERVALS[0]); }
  save();
}
function dueCards(){
  const now = Date.now();
  return Object.keys(s.cards).filter(hr => s.cards[hr].due<=now);
}
function masteredCount(lesson){
  return lesson.words.filter(w => (s.cards[w[0]]?.box||0) >= 3).length;
}

/* ---------- Navigation ---------- */
function show(id){
  document.querySelectorAll("main>section").forEach(x=>x.classList.add("hide"));
  document.getElementById(id).classList.remove("hide");
  ({home:renderHome, lesson:renderLesson, quiz:renderQuiz, review:renderReview, progress:renderProgress, privacy:renderPrivacy}[id])();
}

/* ---------- Home ---------- */
function currentLessonIndex(){
  for(let i=0;i<LESSONS.length;i++) if(!s.lessonsCompleted[LESSONS[i].id]) return i;
  return LESSONS.length-1;
}
function renderHome(){
  const li = currentLessonIndex();
  const lesson = LESSONS[li];
  const allDone = Object.keys(s.lessonsCompleted).length >= LESSONS.length;
  const m = masteredCount(lesson);
  const due = dueCards().length;
  document.getElementById("home").innerHTML = `
  <div class="card">
    <div class="space"><div><div class="muted">${allDone ? "WIEDERHOLUNG" : "HEUTE"}</div><h2>${allDone ? "Alle Lektionen geschafft" : `Lektion ${li+1}: ${lesson.title}`}</h2></div><span class="pill">${lesson.words.length} Wörter</span></div>
    ${allDone ? `<p>Du hast alle Lektionen durchlaufen. Halte deine Wörter mit den fälligen Wiederholungen frisch.</p>`
              : `<p>Neue Ausdrücke für deine nächsten echten Gespräche.</p>
                 <div class="progress"><div style="width:${lesson.words.length? m/lesson.words.length*100:0}%"></div></div>
                 <p class="muted">${m}/${lesson.words.length} aktuell gemeistert</p>
                 <button onclick="startLesson(${li})">${s.lessonsCompleted[lesson.id]?'Nochmal üben':'Lernen starten'}</button>`}
  </div>
  <div class="card">
    <div class="space"><h3>🔁 Wiederholung</h3>${due>0?`<span class="pill">${due} fällig</span>`:''}</div>
    <p class="notice">Wörter kommen nach dem Leitner-Prinzip zurück: unsichere/falsche Wörter schneller, sichere seltener.</p>
    <button class="${due>0?'':'secondary'}" ${due===0?'disabled':''} onclick="show('review')">${due>0? `${due} Wörter wiederholen` : 'Nichts fällig – gut so!'}</button>
  </div>`;
}

/* ---------- Lesson-Flow ---------- */
let curLessonIdx=0, idx=0;
function startLesson(li){ curLessonIdx=li; idx=0; show('lesson'); }
function renderLesson(){
  const lesson = LESSONS[curLessonIdx];
  const w = lesson.words[idx];
  document.getElementById("lesson").innerHTML = `
  <div class="card">
    <div class="space"><span class="pill">Wort ${idx+1}/${lesson.words.length}</span><span class="muted">${lesson.title}</span></div>
    <div class="word" lang="hr">${w[0]}</div>
    <div class="pron">${w[2]}</div>
    <div class="meaning">${w[1]}</div>
    ${w[3] ? `<div class="example"><b lang="hr">${w[3]}</b><br>${w[4]}</div>` : ''}
    ${w[5] ? `<p class="notice">Merktipp: ${w[5]}</p>` : ''}
    <div class="row">
      <button onclick="markWord(true)">✓ Sicher</button>
      <button class="secondary" onclick="markWord(false)">↻ Unsicher</button>
    </div>
  </div>`;
}
function markWord(ok){
  const lesson = LESSONS[curLessonIdx];
  const w = lesson.words[idx];
  onLearnMark(w[0], ok);
  if(idx < lesson.words.length-1){ idx++; renderLesson(); }
  else { curQuiz = buildQuiz(lesson); qIdx=0; qScore=0; show('quiz'); }
}

/* ---------- Quiz (automatisch aus dem Lektionswortschatz generiert, Optionen gemischt) ---------- */
let qIdx=0, qScore=0, curQuiz=[];
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function buildQuiz(lesson, n=6){
  const picked = shuffle(lesson.words).slice(0, Math.min(n, lesson.words.length));
  return picked.map(w=>{
    const askHr = Math.random()<0.5;
    const correct = askHr ? w[1] : w[0];
    const pool = ALL_WORDS.filter(x=>x[0]!==w[0]).map(x=> askHr ? x[1] : x[0]);
    const opts = shuffle([correct, ...shuffle(pool).slice(0,3)]);
    return {question: askHr ? w[0] : w[1], askHr, correct, opts};
  });
}
function renderQuiz(){
  if(qIdx>=curQuiz.length) return finishQuiz();
  const x = curQuiz[qIdx];
  document.getElementById("quiz").innerHTML = `
  <div class="card">
    <div class="muted">QUIZ ${qIdx+1}/${curQuiz.length}</div>
    <h2 ${x.askHr?'lang="hr"':''}>${x.question}</h2>
    ${x.opts.map(o=>`<button class="option" ${x.askHr?'':'lang="hr"'} onclick='answerQuiz(this,${JSON.stringify(o)},${JSON.stringify(x.correct)})'>${o}</button>`).join("")}
  </div>`;
}
function answerQuiz(btn,g,w){
  document.querySelectorAll("#quiz .option").forEach(x=>x.disabled=true);
  if(g===w){ btn.classList.add("correct"); qScore++; }
  else{
    btn.classList.add("wrong");
    document.querySelectorAll("#quiz .option").forEach(x=>{ if(x.textContent===w) x.classList.add("correct"); });
  }
  setTimeout(()=>{ qIdx++; renderQuiz(); }, 650);
}
function finishQuiz(){
  const lesson = LESSONS[curLessonIdx];
  s.lessonsCompleted[lesson.id] = {score:qScore, total:curQuiz.length, date:new Date().toISOString()};
  if(qScore===curQuiz.length) s.streak=(s.streak||0)+1;
  save();
  const perfect = qScore===curQuiz.length;
  document.getElementById("quiz").innerHTML = `
  <div class="card">
    <h2>${perfect ? "🎉 Lektion bestanden!" : "Fast da – wir wiederholen."}</h2>
    <div class="stat">${qScore}/${curQuiz.length}</div>
    <p>${perfect ? "Die Wörter tauchen jetzt automatisch als Wiederholung wieder auf, damit sie langfristig sitzen." : "Kein Problem. Die Wörter kommen in der Wiederholung bald wieder."}</p>
    <button onclick="show('home')">Zur Übersicht</button>
  </div>`;
}

/* ---------- Review / Wiederholung ---------- */
let revQueue=[], revIdx=0, revScore=0;
function renderReview(){
  revQueue = shuffle(dueCards()).slice(0,10);
  revIdx=0; revScore=0;
  stepReview();
}
function stepReview(){
  if(revQueue.length===0){
    document.getElementById("review").innerHTML = `<div class="card"><h2>Nichts fällig</h2><p>Komm später wieder – deine Wörter sind gerade alle frisch genug.</p><button onclick="show('home')">Zur Übersicht</button></div>`;
    return;
  }
  if(revIdx>=revQueue.length) return finishReview();
  const hr = revQueue[revIdx];
  const w = WORD_BY_HR[hr];
  const askHr = Math.random()<0.5; // Richtung zufällig
  const correct = askHr ? w[1] : w[0];
  const pool = ALL_WORDS.filter(x=>x[0]!==hr).map(x=> askHr ? x[1] : x[0]);
  const distractors = shuffle(pool).slice(0,3);
  const opts = shuffle([correct, ...distractors]);
  document.getElementById("review").innerHTML = `
  <div class="card">
    <div class="muted">WIEDERHOLUNG ${revIdx+1}/${revQueue.length}</div>
    <h2 ${askHr?'lang="hr"':''}>${askHr ? w[0] : w[1]}</h2>
    ${opts.map(o=>`<button class="option" ${askHr?'':'lang="hr"'} onclick='answerReview(this,${JSON.stringify(o)},${JSON.stringify(correct)},${JSON.stringify(hr)})'>${o}</button>`).join("")}
  </div>`;
}
function answerReview(btn,g,w,hr){
  document.querySelectorAll("#review .option").forEach(x=>x.disabled=true);
  const ok = g===w;
  if(ok){ btn.classList.add("correct"); revScore++; }
  else{
    btn.classList.add("wrong");
    document.querySelectorAll("#review .option").forEach(x=>{ if(x.textContent===w) x.classList.add("correct"); });
  }
  onReviewAnswer(hr, ok);
  setTimeout(()=>{ revIdx++; stepReview(); }, 650);
}
function finishReview(){
  document.getElementById("review").innerHTML = `
  <div class="card">
    <h2>Wiederholung fertig</h2>
    <div class="stat">${revScore}/${revQueue.length}</div>
    <p class="notice">Richtige Wörter kommen später wieder, falsche schon bald erneut.</p>
    <button onclick="show('home')">Zur Übersicht</button>
  </div>`;
}

/* ---------- Fortschritt ---------- */
function renderProgress(){
  const rows = LESSONS.map((l,i)=>{
    const done = s.lessonsCompleted[l.id];
    const due = l.words.filter(w=>s.cards[w[0]] && s.cards[w[0]].due<=Date.now()).length;
    let badge = '<span class="badge locked">offen</span>';
    if(done) badge = `<span class="badge done">${done.score}/${done.total}</span>`;
    if(due>0) badge += ` <span class="badge due">${due} fällig</span>`;
    return `<div class="lessonrow"><div><b>${l.title}</b><div class="muted">${l.words.length} Wörter</div></div>${badge}</div>`;
  }).join("");
  const totalMastered = ALL_WORDS.filter(w=>(s.cards[w[0]]?.box||0)>=3).length;
  document.getElementById("progress").innerHTML = `
  <div class="card">
    <h2>Fortschritt</h2>
    <div class="row">
      <div><div class="stat">${totalMastered}/${ALL_WORDS.length}</div><div class="muted">Wörter gemeistert</div></div>
      <div><div class="stat">${Object.keys(s.lessonsCompleted).length}/${LESSONS.length}</div><div class="muted">Lektionen</div></div>
      <div><div class="stat">${s.streak||0}</div><div class="muted">perfekte Quizze</div></div>
    </div>
  </div>
  <div class="card"><h3>Lektionen</h3>${rows}</div>`;
}

/* ---------- Privacy ---------- */
function renderPrivacy(){
  document.getElementById("privacy").innerHTML = `
  <div class="card">
    <h2>🔒 Privatsphäre</h2>
    <p>Diese App ist local-first.</p>
    <ul>
      <li>Kein Konto</li>
      <li>Keine Werbung</li>
      <li>Keine Analyse/Tracker</li>
      <li>Keine Standort-, Kamera-, Mikrofon-, Kontakte- oder Foto-Berechtigungen</li>
      <li>Lernstand nur im Speicher dieser App/Webseite</li>
    </ul>
    <p class="notice">Eine Web-App kann nicht auf Daten anderer iPhone-Apps wie Nachrichten, Kontakte oder Fotos zugreifen, ohne entsprechende iOS-Berechtigungen – diese App fordert keine an.</p>
  </div>
  <div class="card">
    <h3>Datenkontrolle</h3>
    <div class="row">
      <button onclick="exportData()" class="secondary">Export</button>
      <button onclick="wipe()" class="ghost">Alles löschen</button>
    </div>
    <p class="notice">Export wird nur auf dein Gerät heruntergeladen; es gibt keinen automatischen Upload.</p>
  </div>`;
}
function exportData(){
  const b = new Blob([JSON.stringify(s,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "kroatisch-tutor-daten.json";
  a.click();
}
function wipe(){
  if(confirm("Alle lokalen Lerndaten löschen?")){
    try{ localStorage.removeItem(KEY); }catch(e){}
    memoryFallback.store = null;
    location.reload();
  }
}

/* ---------- Start ---------- */
if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }
show("home");
</script>
